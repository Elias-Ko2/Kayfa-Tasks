<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

<main>

  <div class="card">

    <div class="summary">
      <h3>Summary</h3>

      <div class="reaction">

        <div>
          <img src="assets/images/icon-reaction.svg" alt="Reaction">
          <p class="text">Reaction</p>
        </div>

        <div>
          <p>80</p>
          <p class="max">/ 100</p>
        </div>

      </div>

      <div class="memory">
        
        <div>
          <img src="assets/images/icon-memory.svg" alt="Reaction">
          <p class="text">Memory</p>
        </div>

        <div>
          <p>92</p>
          <p class="max">/ 100</p>
        </div>

      </div>

      <div class="verbal">
        
        <div>
          <img src="assets/images/icon-verbal.svg" alt="Reaction">
          <p class="text">Verbal</p>
        </div>

        <div>
          <p>61</p>
          <p class="max">/ 100</p>
        </div>

      </div>

      <div class="visual">
        
        <div>
          <img src="assets/images/icon-visual.svg" alt="Reaction">
          <p class="text">Visual</p>
        </div>

        <div>
          <p>73</p>
          <p class="max">/ 100</p>
        </div>

      </div>

      <p class="continue">Continue</p>

    </div>

    <div class="result">

      <h3>Your Result</h3>

      <div>

        <h1>76</h1>
        <h4>of 100</h4>

      </div>

      <h2>Great</h2>

      <p>You scored higher than 65% of <br>the people who taken <br>these tests.</p>

    </div>

  </div>

</main>

</body>
</html>
