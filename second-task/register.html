<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
</head>
<body>
    <form method="POST">
        <fieldset>
            <legend>Account</legend>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" required>
        </fieldset>

        <fieldset>
            <legend>Personal</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required><br>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required><br>
            <label for="birthdate">Birth Date:</label>
            <input type="date" id="birthdate" name="birthdate" required>
        </fieldset>

        <fieldset>
            <legend>Preferences</legend>
            <label>Gender :</label><br>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="Female"><br>
            <label>Hobbies :</label><br>
            <label for="Coding">Coding</label>
            <input type="checkbox" id="Coding" name="interest" value="Coding">
            <label for="Gaming">Gaming</label>
            <input type="checkbox" id="Gaming" name="interest" value="Gaming">
            <label for="Reading">Reading</label>
            <input type="checkbox" id="Reading" name="interest" value="Reading"><br>
            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="">Country</option>
                <option value="Syria">Syria</option>
                <option value="Egypt">Egypt</option>
            </select>
        </fieldset>

        <button type="submit">Register</button>
    </form>

    <table border="1">
        <caption>Cusotmer Support</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Phone</th>
                <th scope="col">Country</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Elias</td>
                <td>+963 987 654 321</td>
                <td>Syria</td>
            </tr>
            <tr>
                <td>Karim</td>
                <td>+20 12 34567890</td>
                <td>Egypt</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
